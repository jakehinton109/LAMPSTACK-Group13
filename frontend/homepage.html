        <script>
        function deselectAllFilters() {
            document.querySelectorAll("#filterMenu .dropdown-item").forEach(option => {
                if (option.classList.contains("active")) {
                    option.classList.remove("active");
                    option.textContent = option.textContent.slice(0, -1);
                }
            });
        }
        function changeFilterSelect(element){
            deselectAllFilters()
            element.innerHTML += ' <i class="bi bi-check2-circle"></i>'
            element.classList.add("active")
        }
        function showPositions(){
            document.getElementById("filterMenu").innerHTML = `
            <li>
                <h6 class="dropdown-header">
                    Filter by Position
                </h6>  
            </li>
                <li>
                <button class="dropdown-item" type="button" onclick="changeFilterSelect(this)">
                    QB
                </button>
            </li>
            <li>
                <button class="dropdown-item" type="button" onclick="changeFilterSelect(this)">
                    RB
                </button>
            </li>
            <li>
                <button class="dropdown-item" type="button" onclick="changeFilterSelect(this)">
                    WR
                </button>
            </li>
            <li>
                <button class="dropdown-item" type="button" onclick="changeFilterSelect(this)">
                    TE
                </button>
            </li>
            <li>
                <hr class="dropdown-divider">
            </li>
            <li>
                <button class="dropdown-item" type="button" onclick="showFilters()">
                    <i class="bi bi-arrow-left me-2"></i> Back
                </button>
            </li>
            
            
            `
        }
        function showFilters(){
            document.getElementById("filterMenu").innerHTML = `
            <li><button id="filterPos" class="dropdown-item" type="button" onclick="showPositions()">Position</button></li>
            <li><button id="filterSide" class="dropdown-item" type="button" onclick="changeFilterSelect(this)">Side</button></li>
            <li><button id="filterNone" class="dropdown-item" type="button" onclick="changeFilterSelect(this)">No Filter</button></li>
            
            `
            changeFilterSelect(document.getElementById("filterNone"))
        }
    </script>
