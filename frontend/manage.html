    <script>
    function hideAllFilterEntries() {
        document.querySelectorAll("#filterMenu .filter-entry").forEach(entry => {
            entry.style.display = "none";
        });
    }

    function showPositions() {
        hideAllFilterEntries();

        document.querySelectorAll("#filterMenu .position-entry").forEach(entry => {
            entry.style.display = "";
        });
    }

    function showSides() {
    hideAllFilterEntries();

    document.querySelectorAll("#filterMenu .side-entry").forEach(entry => {
        entry.style.display = "";
    });
}

    function showFilters() {
        hideAllFilterEntries();

        document.querySelectorAll("#filterMenu .main-filter-entry").forEach(entry => {
            entry.style.display = "";
        });
    }
    showFilters()
    document.getElementById("searchForm").reset();
</script>
