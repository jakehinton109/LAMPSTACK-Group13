<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COP 4331 LAMP Stack Demo</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="alternate icon" href="favicon.ico">
    <!-- Custom Styles -->
    <link href="css/styles.css" rel="stylesheet">
    <!-- Scripts -->
    <script type="text/javascript" src="js/md5.js"></script>
    <script type="text/javascript" src="js/code.js"></script>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-5">
    <div class="background-glow"></div>
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5">
                
                <!-- Title Header -->
                <div class="text-center mb-4">

                    <h1 id="title" class="fw-bold tracking-tight">COP 4331 LAMP Stack</h1>
                    <p class="text-secondary-contrast small">Player Management Portal</p>
                </div>

                <!-- Login Card -->
                <div id="loginDiv" class="card glass-card shadow-lg border-0 p-4 p-sm-5">
                    <div class="card-body p-0">
                        <span id="inner-title" class="d-block text-center fw-semibold text-uppercase tracking-wider mb-4 fs-5">Register a New Account</span>
                        
                        <form id="loginForm" onsubmit="event.preventDefault(); doRegister();" class="needs-validation">
                            <!-- Username Input Group -->
                            <div class="mb-3">
                                <label for="loginName" class="form-label form-label-contrast small">Username</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person text-secondary-contrast"></i></span>
                                    <input type="text" id="loginName" class="form-control" placeholder="Enter username" required />
                                </div>
                            </div>

                            <!-- First / Last Name-->
                            <div class="mb-3">
                                <label for="firstName" class="form-label form-label-contrast small">First Name</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person text-secondary-contrast"></i></span>
                                    <input type="text" id="firstName" class="form-control" placeholder="John" required />
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="lastName" class="form-label form-label-contrast small">Last Name</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person text-secondary-contrast"></i></span>
                                    <input type="text" id="lastName" class="form-control" placeholder="Doe" required />
                                </div>
                            </div>

                            <!-- Team Name-->
                             <div class="mb-3">
                                <label for="teamName" class="form-label form-label-contrast small">Team Name</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person text-secondary-contrast"></i></span>
                                    <input type="text" id="teamName" class="form-control" placeholder="Buffalo Bills" required />
                                </div>
                            </div>
                            
                            <!-- Password Input Group -->
                            <div class="mb-4">
                                <label for="loginPassword" class="form-label form-label-contrast small">Create Password</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock text-secondary-contrast"></i></span>
                                    <input type="password" id="loginPassword" class="form-control" placeholder="Enter password" required />
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="confirmPassword" class="form-label form-label-contrast small">Confirm Password</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock text-secondary-contrast"></i></span>
                                    <input type="password" id="confirmPassword" class="form-control" placeholder="Enter password" required />
                                </div>
                            </div>

                            <!-- Login Button -->
                            <button type="submit" id="loginButton" class="buttons btn btn-primary w-100 py-3 fw-semibold rounded-3 shadow-sm d-flex align-items-center justify-content-center gap-2">
                                <span>Make Account</span>
                                <i class="bi bi-arrow-right"></i>
                            </button>

                            <button  type="button" id="registerButton" onclick="window.location.href='index.html'" class="buttons btn btn-primary w-100 py-3 fw-semibold rounded-3 shadow-sm d-flex align-items-center justify-content-center gap-2">
                                <i class="bi bi-arrow-left"></i>
                                <span>Back to Login</span>
                                 
                            </button>
                        </form>

                        <!-- Feedback Result Message -->
                        <div class="mt-3 text-center">
                            <span id="loginResult" class="small fw-semibold"></span>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
